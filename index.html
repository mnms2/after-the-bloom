function getMaterialSources(n){const src=[...(materialSources[n]||[])];for(const [field,names] of Object.entries(FIELD_MATERIALS))if(names.includes(n))src.push(({greenhouse:'탐사 · 버려진 온실',forest:'탐사 · 침식된 숲길',gather:'채집 · 학원 외곽 채집지'})[field]);for(const monster of HUNT_MONSTERS)if(monster.loot===n)src.push('파티 토벌 · '+monster.name);for(const shop of shopItems)if(shop.name===n)src.push((shop.vendor==='herb'?'NPC · 에델의 약초 상점':'NPC · 브란의 보급소')+' ('+shop.price+' G)');return src.length?src:['현재 구현된 획득처 없음']}
function materialCards(names){return names.map(n=>{let uses=RECIPES.filter(r=>r.needs[n]).map(r=>r.name);return `<div class="item"><div class="split"><strong>${esc(n)}</strong><span class="tag">보유 ${S.inventory[n]||0}</span></div><p class="tiny muted" style="margin-bottom:5px">획득처</p><div class="source-list">${getMaterialSources(n).map(t=>`<div class="tiny">${esc(t)}</div>`).join('')}</div><p class="tiny muted" style="margin-bottom:0">사용 레시피: ${esc(uses.join(' · '))}</p></div>`}).join('')||'<p class="muted">검색된 재료가 없습니다.</p>'}
function renderMaterialResults(){const el=document.getElementById('materialResults');if(el)el.innerHTML=materialCards([...new Set(RECIPES.flatMap(r=>Object.keys(r.needs)))].filter(n=>n.includes(materialSearch)).sort((a,b)=>a.localeCompare(b,'ko')))}
function openMaterialCodex(n){materialSearch=n;codexFilter='전체';go('codex')}
function chooseRecipe(id){const el=document.getElementById('recipeScroll');const pos=el?.scrollTop||0;selectedRecipe=id;render();const next=document.getElementById('recipeScroll');if(next)next.scrollTop=pos}

const QUALITY_NAMES=['','일반','양호','우수','정교','걸작'];
function qualityCap(r){if(!r.spec)return 3;if(S.dept!=='제작부')return 0;return r.spec===S.specialization?5:3}
function qualityChance(r){const cap=qualityCap(r);return cap?Math.min(cap,Math.max(1,1+Math.floor((S.grade-1)/3)+Math.floor((stats().행운||10)/30)+Math.floor(Math.random()*3))):0}
function qualityName(base,q){return q>0?base+' ['+QUALITY_NAMES[q]+']':base}
function craftItemName(base,q,maker,specialization){const clean=String(maker||'이름 없는 학생').replace(/[^가-힣a-zA-Z0-9 _-]/g,'').slice(0,24);return qualityName(base,q)+' {제작자:'+clean+';전공:'+specialization+'}'}
function parseCraftItem(name){const m=name.match(/^(.*?) \[([^\]]+)\] \{제작자:([^;]*);전공:([^}]*)\}$/);if(!m)return null;return {base:m[1],quality:QUALITY_NAMES.indexOf(m[2]),maker:m[3],specialization:m[4]}}

function registerQualityItem(name){
 const crafted=parseCraftItem(name);
 if(crafted){const b=itemCatalog[crafted.base];if(!b)return;
  const ownSpecial=crafted.base==='회복 포션'?'알케미스트':RECIPES.find(r=>r.name===crafted.base)?.spec;
  const specialized=!!ownSpecial&&crafted.specialization===ownSpecial;
  const effect=crafted.base==='회복 포션'?(specialized?40:30):crafted.base==='강화 회복 포션'?(specialized?80:60):null;
  itemCatalog[name]={...b,tags:[...new Set([...(b.tags||[]),'제작품','품질',QUALITY_NAMES[crafted.quality]||'일반','제작자:'+crafted.maker,'제작전공:'+crafted.specialization,specialized?'전공제작':'비전공제작'])],desc:b.desc+' · '+(b.bonus?'최종 능력치: '+Object.entries(b.bonus).map(([k,v])=>k+' +'+(v+Math.max(0,crafted.quality-1)+(specialized?1:0))).join(', ')+' · ':'')+(QUALITY_NAMES[crafted.quality]||'일반')+' · 제작자 '+crafted.maker+' ('+crafted.specialization+')'+(effect!==null?' · HP +'+effect:'') ,heal:effect,bonus:b.bonus?Object.fromEntries(Object.entries(b.bonus).map(([k,v])=>[k,v+Math.max(0,crafted.quality-1)+(specialized?1:0)])):undefined};
  return;
 }
 const match=name.match(/^(.*) \[([^\]]+)\]$/);if(!match)return;const base=match[1],q=QUALITY_NAMES.indexOf(match[2]);if(q<1||!itemCatalog[base])return;const b=itemCatalog[base];itemCatalog[name]={...b,tags:[...b.tags,'품질',match[2]],desc:b.desc+' · '+match[2]+' 품질',bonus:b.bonus?Object.fromEntries(Object.entries(b.bonus).map(([k,v])=>[k,v+Math.max(0,q-1)])):undefined};}

function mailPage(){const a=mailList().slice().reverse(),unread=a.filter(m=>!m.read).length;
 return header('우편함','운영자가 보낸 공지와 보상을 확인하고 수령할 수 있습니다.')+
 `<div class="grid"><section class="card wide"><div class="split"><h3>받은 우편</h3><span class="tag">안 읽음 ${unread}통 · 총 ${a.length}통</span></div><p class="tiny muted">첨부 보상은 수령 버튼을 눌러야 가방과 소지 금화에 반영됩니다. 수령은 한 번만 가능합니다.</p><div class="list">${a.length?a.map(m=>`<div class="item"><div class="split"><strong>${m.read?'':'● '}${mailEsc(m.title)}</strong><span class="tiny muted">${mailTimestamp(m.sentAt)}</span></div><p class="tiny muted">보낸 사람: ${mailEsc(m.from||'아카데미 운영진')}</p><p style="white-space:pre-wrap;overflow-wrap:anywhere">${mailEsc(m.body)}</p>${m.gold||m.qty?`<p class="tiny">첨부: ${m.gold?fmt(m.gold)+' G':''} ${m.item&&m.qty?mailEsc(m.item)+' ×'+fmt(m.qty):''}</p>`:''}<div class="controls">${!m.read?btn('읽음 표시',`mailRead('${m.id}')`,'alt'):''}${(m.gold||m.qty)?btn(m.claimed?'수령 완료':'첨부 수령',`mailClaim('${m.id}')`,m.claimed?'alt disabled':''):''}${btn('삭제',`mailDelete('${m.id}')`,'alt')}</div></div>`).join(''):'<p class="empty">아직 도착한 우편이 없습니다.</p>'}</div></section></div>`}
function adminMailPage(){if(!isMailAdmin())return header('운영자 우편','운영자 전용 메뉴입니다.')+'<p class="empty">운영자 계정으로 로그인해 주세요. 로컬 시제품에서는 아이디 admin으로 가입한 계정만 접근할 수 있습니다.</p>';
 const students=roster.students.filter(x=>x.id!=='main'&&x.data?.specialization);
 return header('운영자 우편 발송','전체 학생 또는 특정 학생에게 공지와 첨부 보상을 발송합니다.')+
 `<div class="grid"><section class="card wide"><h3>새 우편 작성</h3><div class="list"><label class="tiny muted">받는 사람</label><select id="adminMailTo" class="field"><option value="all">전체 학생 (${students.length}명)</option>${students.map(u=>`<option value="${mailEsc(u.id)}">${mailEsc(u.name)} (${mailEsc(u.id)})</option>`).join('')}</select><label class="tiny muted">제목</label><input id="adminMailTitle" class="field" maxlength="70" placeholder="우편 제목"><label class="tiny muted">본문</label><textarea id="adminMailBody" class="field" rows="6" maxlength="3000" style="width:100%;resize:vertical" placeholder="학생에게 보낼 메시지를 입력하세요"></textarea><div class="controls"><div><label class="tiny muted">첨부 금화 (G)</label><input id="adminMailGold" class="field" type="number" min="0" max="1000000" value="0"></div><div><label class="tiny muted">첨부 아이템</label><select id="adminMailItem" class="field"><option value="">없음</option>${Object.keys(itemCatalog).sort((a,b)=>a.localeCompare(b,'ko')).map(n=>`<option value="${mailEsc(n)}">${mailEsc(n)}</option>`).join('')}</select></div><div><label class="tiny muted">수량</label><input id="adminMailQty" class="field" type="number" min="0" max="9999" value="0"></div></div>${btn('우편 발송','adminSendMail()')}</div><p class="tiny muted">테스트 모드: 이 브라우저에 가입된 계정에만 전달됩니다. 운영자 인증과 발송 권한은 정식 서버에서 별도로 구현해야 합니다.</p></section></div>`}
function adminSendMail(){if(!isMailAdmin())return alert('운영자 전용 기능입니다.');
 const to=document.getElementById('adminMailTo').value,title=document.getElementById('adminMailTitle').value.trim(),body=document.getElementById('adminMailBody').value.trim(),gold=Number(document.getElementById('adminMailGold').value),item=document.getElementById('adminMailItem').value,qty=Number(document.getElementById('adminMailQty').value);
 if(!title||!body)return alert('제목과 내용을 입력해 주세요.');
 if(!Number.isSafeInteger(gold)||gold<0||gold>1000000||!Number.isSafeInteger(qty)||qty<0||qty>9999)return alert('첨부 수량을 확인해 주세요.');
 if((item&&!qty)||(!item&&qty))return alert('첨부 아이템과 수량을 함께 지정해 주세요.');
 const targets=roster.students.filter(x=>x.id!=='main'&&x.data?.specialization&&(to==='all'||x.id===to));
 if(!targets.length)return alert('받는 학생이 없습니다.');
 if(!confirm(`${targets.length}명에게 우편을 발송할까요?`))return;
 const sentAt=Date.now();for(const u of targets){u.data.mailbox ||= [];u.data.mailbox.unshift({id:'mail_'+sentAt+'_'+Math.random().toString(36).slice(2,10),title,body,from:'아카데미 운영진',gold,item,qty,read:false,claimed:false,sentAt});if(u.data.mailbox.length>MAIL_MAX)u.data.mailbox=u.data.mailbox.slice(0,MAIL_MAX)}
 save();alert(`${targets.length}명에게 우편을 발송했습니다.`);render()}
pages.mail=mailPage;pages.admin=adminMailPage;
const oldMailRender=render;
render=function(){oldMailRender();if(!isMailAdmin()){document.querySelectorAll('#nav button').forEach(b=>{if(b.textContent==='운영자 우편')b.remove()})}else{ /* admin menu visible */ }};

(async function authBoot(){try{const {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(session?.user){await authLoadUser(session.user)}else authGate()}catch(err){authGate();authSetError('인증 서버 연결 실패: '+err.message)}})();
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){authMode='newpass';authGate()}});
</script></body></html>
